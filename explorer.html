<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HKGeoCode explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { margin: 0; height: 100%; font-family: sans-serif; }
    .leaflet-container.basemap-landsd-grey .leaflet-tile-pane .leaflet-tile,
    .leaflet-container.basemap-landsd-grey .leaflet-landsdLabel-pane .leaflet-tile {
      filter: grayscale(100%);
    }
    .leaflet-hkgGrid-pane { z-index: 350; pointer-events: none; }
    .leaflet-landsdLabel-pane { z-index: 250; pointer-events: none; }
    .leaflet-attribution-flag { display: none; }
    .landsd-logo {
      display: none;
      background: #7a1f2b;
      color: #fff;
      font: 700 12px/1.25 sans-serif;
      padding: 6px 10px;
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      align-items: center;
      gap: 8px;
    }
    body.basemap-landsd .landsd-logo { display: block; }
    .landsd-logo small { display: block; font-weight: 600; font-size: 10px; color: #f3d5d8; }
    .hover-line { margin-top: 10px; font-family: ui-monospace, Consolas, monospace; }
    .hover-line span { font-size: 15px; letter-spacing: 0.06em; }
    .panel {
      position: absolute; z-index: 1000; top: 12px; right: 12px;
      background: #fff; padding: 12px 14px; border: 1px solid #ccc;
      width: 280px; font-size: 13px; line-height: 1.4;
      max-height: calc(100% - 24px); overflow: auto;
    }
    .panel h1 { font-size: 15px; margin: 0 0 8px; }
    .code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 20px; letter-spacing: 0.06em; margin: 4px 0 2px;
    }
    #cell-neighbours { font-family: ui-monospace, Consolas, monospace; word-break: break-word; }
    label, .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
    select, input[type="text"] { flex: 1; min-width: 0; padding: 4px 6px; }
    button { padding: 4px 10px; }
    .meta { color: #444; margin: 0 0 8px; }
    .status { color: #333; margin-top: 10px; }
    .legend span { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: middle; }
    .swatch-grid { border: 1px solid #555; }
    .swatch-sel { background: #c1121f; }
    .swatch-parent { border: 2px dashed #1d4ed8; }
    .swatch-neighbour { background: #d97706; }
    .swatch-child { background: #0f766e; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>HKGeoCode explorer</h1>
    <div class="code" id="cell-code">Click the map</div>
    <p class="meta" id="cell-level">Neighbourhood (100 m)</p>
    <p class="meta" id="cell-origin">—</p>
    <p class="meta">Parent: <span id="cell-parent">—</span></p>
    <p class="meta">Neighbours: <span id="cell-neighbours">—</span></p>
    <div class="row">
      <button type="button" id="copy-code" disabled>Copy</button>
      <button type="button" id="go-parent" disabled>Select parent</button>
      <button type="button" id="fit-cell" disabled>Fit cell</button>
      <button type="button" id="clear-cell" disabled>Reset</button>
    </div>
    <label>
      Basemap
      <select id="basemap">
        <option value="landsd" selected>LandsD</option>
        <option value="landsd-grey">LandsD grey</option>
        <option value="osm">OpenStreetMap</option>
      </select>
    </label>
    <label>
      Resolution
      <select id="resolution">
        <option value="auto">Auto (by zoom)</option>
        <option value="2">2 km (2 chars)</option>
        <option value="4">100 m (4 chars)</option>
        <option value="6">5 m (6 chars)</option>
      </select>
    </label>
    <label><input type="checkbox" id="show-grid" checked> All cell boundaries at selected level (in view)</label>
    <label><input type="checkbox" id="show-labels"> Identifiers at cell centres</label>
    <label><input type="checkbox" id="show-parent"> Parent boundary</label>
    <label><input type="checkbox" id="show-neighbours" checked> Neighbour cells</label>
    <label><input type="checkbox" id="show-children"> Child cells in view</label>
    <label>
      Go to code
      <input id="search-code" type="text" maxlength="6" placeholder="e.g. H8FB2H" spellcheck="false">
    </label>
    <p class="meta legend">
      <span class="swatch-grid"></span>view
      <span class="swatch-sel"></span>selected
      <span class="swatch-parent"></span>parent
      <span class="swatch-neighbour"></span>neighbours
      <span class="swatch-child"></span>children
    </p>
    <p class="status" id="grid-status"></p>
    <p class="meta hover-line">Mouseover <span id="hover-code">—</span></p>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/proj4@2.11.0/dist/proj4.js"></script>
  <script src="js/hkgeocode.js"></script>
  <script src="js/explorer.js"></script>
</body>
</html>
