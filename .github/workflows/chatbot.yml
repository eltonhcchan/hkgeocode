name: chatbot

on:
  push:
    paths:
      - "chatbot/**"
      - "chatbot_app.py"
      - "hkgeocode.py"
      - "requirements*.txt"
      - ".github/workflows/chatbot.yml"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - name: HKGeoCode self-test
        run: python hkgeocode.py --self-test
      - name: Lint
        run: python -m pyflakes chatbot chatbot_app.py
      - name: Offline smoke test (synthetic layers, no network)
        run: python -m chatbot.smoke
      - name: Streamlit app starts
        run: |
          streamlit run chatbot_app.py --server.headless true --server.port 8599 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8599/_stcore/health && exit 0
            sleep 1
          done
          echo "Streamlit did not become healthy" && exit 1
